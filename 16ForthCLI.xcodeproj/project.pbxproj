				"",
				"# Remove any quarantine attribute",
				"xattr -d com.apple.quarantine \"${DEST_BINARY}\" 2>/dev/null || true",
				"",
				"# Re-apply an ad-hoc signature (required on Apple Silicon)",
				"codesign --force --sign - \"${DEST_BINARY}\"",
				"",
